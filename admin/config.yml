backend:
  name: git-gateway
  branch: main

locale: he
media_folder: "assets/uploads"
public_folder: "/assets/uploads"
site_url: "https://haim-netanel-photography.netlify.app"
display_url: "https://haim-netanel-photography.netlify.app"
logo_url: "/assets/logo.png"

collections:
  - name: "site"
    label: "ניהול האתר"
    label_singular: "עמוד"
    files:
      - name: "home"
        label: "🏠 דף הבית"
        file: "content/site.json"
        format: "json"
        fields:
          - label: "פתיח ראשי"
            name: "hero"
            widget: "object"
            collapsed: false
            fields:
              - { label: "כותרת לבנה (כותרת מותג – לא לשנות)", name: "title_white", widget: "string" }
              - { label: "כותרת זהב (כותרת מותג – לא לשנות)", name: "title_gold", widget: "string" }
              - { label: "טקסט פתיחה", name: "description", widget: "text" }
              - { label: "תמונת פתיחה", name: "image", widget: "image", choose_url: false }
          - label: "אודות בדף הבית"
            name: "about"
            widget: "object"
            collapsed: true
            fields:
              - { label: "כותרת", name: "title", widget: "string" }
              - { label: "טקסט קצר", name: "text", widget: "text" }
          - label: "גלריה בדף הבית"
            name: "gallery"
            widget: "list"
            collapsed: true
            minimize_collapsed: true
            summary: "{{fields.title}}"
            add_to_top: true
            fields:
              - { label: "כותרת", name: "title", widget: "string" }
              - { label: "תמונה", name: "image", widget: "image", choose_url: false }
              - { label: "תיאור לתמונה", name: "alt", widget: "string", required: false }
          - label: "כרטיסי אירועים בדף הבית"
            name: "services"
            widget: "list"
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - { label: "שם האירוע", name: "title", widget: "string" }
              - { label: "שורת משנה", name: "subtitle", widget: "string" }
              - { label: "תמונת הכרטיס", name: "image", widget: "image", choose_url: false }
              - { label: "קישור", name: "href", widget: "string", default: "gallery.html" }
          - label: "פרטי קשר"
            name: "contact"
            widget: "object"
            collapsed: true
            fields:
              - { label: "טלפון להצגה", name: "phone_display", widget: "string", hint: "לדוגמה 052-308-4940" }
              - { label: "טלפון לחיוג", name: "phone_e164", widget: "string", hint: "+972..." }
              - { label: "WhatsApp", name: "whatsapp", widget: "string", hint: "972... ללא +" }
          - label: "אזורי שירות"
            name: "areas"
            widget: "text"
