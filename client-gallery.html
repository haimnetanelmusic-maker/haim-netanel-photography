<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#080808"><title>הגלריה הפרטית שלי | Haim Netanel Photography</title><link rel="icon" href="assets/logo.webp"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="client-gallery.css"></head><body class="client-gallery-page"><header class="cg-header"><img src="assets/logo.webp" alt="Haim Netanel Photography"><span>הגלריה הפרטית שלי</span></header><main class="cg-main"><section id="cgLoading" class="cg-state"><h1>טוען את הגלריה…</h1><p>רגע אחד.</p></section><section id="cgError" class="cg-state" hidden><h1>הקישור אינו זמין</h1><p id="cgErrorText">ייתכן שהקישור פג או הוחלף.</p></section><section id="cgApp" hidden><div class="cg-hero"><div><div class="cg-eyebrow">גלריה פרטית</div><h1 id="cgTitle"></h1><p id="cgMeta"></p></div><div class="cg-counter"><b id="cgSelected">0</b><span id="cgLimit">תמונות נבחרו</span></div></div><div class="cg-toolbar"><button class="cg-filter active" data-filter="all">הכול</button><button class="cg-filter" data-filter="selected">רק נבחרות</button><span id="cgStatus"></span></div><div id="cgGrid" class="cg-grid"></div><section class="cg-submit"><h2>סיימתם לבחור?</h2><p>אפשר לחזור ולשנות את הבחירה עד לשליחה הסופית.</p><div class="cg-form"><input id="cgName" placeholder="שם"><input id="cgEmail" type="email" dir="ltr" placeholder="אימייל"><textarea id="cgNotes" placeholder="הערה לצלם (לא חובה)"></textarea><button id="cgSubmitBtn" class="btn btn-gold">אישור ושליחת הבחירה</button></div><div id="cgSubmitMsg"></div></section></section></main>
<div id="cgLightbox" class="cg-lightbox" hidden aria-hidden="true">
  <button id="cgLbClose" class="cg-lb-icon cg-lb-close" type="button" aria-label="סגירת תמונה">✕</button>
  <button id="cgLbPrev" class="cg-lb-icon cg-lb-nav cg-lb-prev" type="button" aria-label="תמונה קודמת">‹</button>
  <button id="cgLbNext" class="cg-lb-icon cg-lb-nav cg-lb-next" type="button" aria-label="תמונה הבאה">›</button>
  <div class="cg-lb-stage" id="cgLbStage">
    <img id="cgLbImage" alt="" draggable="false">
  </div>
  <div class="cg-lb-toolbar" role="toolbar" aria-label="כלי צפייה בתמונה">
    <span id="cgLbCount" class="cg-lb-count"></span>
    <span id="cgLbFilename" class="cg-lb-filename"></span>
    <div class="cg-lb-actions">
      <button id="cgLbZoomOut" type="button" class="cg-lb-action" aria-label="הקטנת תמונה">−</button>
      <button id="cgLbZoom" type="button" class="cg-lb-action" aria-label="הגדלת תמונה">⌕ <span id="cgLbZoomLabel">100%</span></button>
      <button id="cgLbZoomIn" type="button" class="cg-lb-action" aria-label="הגדלת תמונה">＋</button>
      <button id="cgLbSelect" type="button" class="cg-lb-select">♡ בחירת התמונה</button>
    </div>
  </div>
</div>
<script type="module" src="client-gallery.js"></script></body></html>
